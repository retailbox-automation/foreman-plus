<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman+ — Fleet Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://esm.sh/reactflow@11/dist/style.css">
<style>
:root{
  --steel-950:#14181D; --steel-900:#1C2229; --steel-800:#232B34; --steel-700:#39434E;
  --paper:#E8E4DA; --paper-dim:#9AA1A9; --safety:#FF6A00; --reject:#E5484D; --tag:#6CA0F5;
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{background:var(--steel-950); color:var(--paper);
  font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;}
#root{height:100%}
.app{display:grid; height:100vh; grid-template-rows:52px 1fr 168px;
  grid-template-columns:minmax(0,3fr) minmax(340px,2fr); gap:1px; background:var(--steel-700)}
.bar{grid-column:1/3; background:var(--steel-900); display:flex; align-items:center;
  gap:20px; padding:0 18px}
.wordmark{font:700 26px "Big Shoulders"; letter-spacing:.06em; text-transform:uppercase}
.wordmark b{color:var(--safety)}
.bar .sub{color:var(--paper-dim); font-size:12px; letter-spacing:.14em; text-transform:uppercase}
.bar .spacer{flex:1}
.counter{font:600 13px "IBM Plex Mono"; color:var(--paper-dim)}
.counter b{color:var(--paper)}
.counter .ok{color:var(--safety)} .counter .no{color:var(--reject)}
.panel{background:var(--steel-950); min-height:0; display:flex; flex-direction:column}
.panel h2{font:500 12px "Big Shoulders"; letter-spacing:.22em; text-transform:uppercase;
  color:var(--paper-dim); padding:10px 14px 8px; border-bottom:1px solid var(--steel-800)}
.flow{flex:1; min-height:0}
.ledger{flex:1; overflow-y:auto; scrollbar-width:thin}
.row{display:flex; gap:10px; padding:9px 14px; border-bottom:1px solid var(--steel-800);
  align-items:flex-start; font-family:"IBM Plex Mono"; font-size:12px}
.row.fresh{animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateY(-6px); opacity:0}}
.row .who{color:var(--tag); min-width:70px}
.row .what{flex:1; min-width:0}
.row .what .subj{color:var(--paper); font-weight:600}
.row .what .pred{color:var(--paper-dim)}
.row .what .val{color:var(--paper); word-break:break-word}
.row .what .why{color:var(--paper-dim); font-size:11px; margin-top:2px}
.stamp{font:700 13px "Big Shoulders"; letter-spacing:.12em; text-transform:uppercase;
  border:2px solid; border-radius:3px; padding:1px 7px; transform:rotate(-6deg);
  align-self:center; white-space:nowrap}
.stamp.approved{color:var(--safety); border-color:var(--safety)}
.stamp.rejected{color:var(--reject); border-color:var(--reject)}
.row.fresh .stamp{animation:thunk .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes thunk{from{transform:rotate(-6deg) scale(1.6); opacity:0}}
.jobs{grid-column:1/3; background:var(--steel-900); overflow-x:auto; display:flex;
  gap:10px; padding:12px 14px; align-items:stretch}
.job{background:var(--steel-800); border:1px solid var(--steel-700); border-radius:4px;
  min-width:240px; padding:10px 12px; flex-shrink:0}
.job .id{font:700 15px "Big Shoulders"; letter-spacing:.08em; color:var(--paper);
  text-transform:uppercase; margin-bottom:6px}
.chip{display:inline-block; font:11px "IBM Plex Mono"; color:var(--paper-dim);
  border:1px solid var(--steel-700); border-radius:3px; padding:1px 6px; margin:0 4px 4px 0}
.chip b{color:var(--paper); font-weight:400}
.empty{color:var(--paper-dim); padding:24px; font-size:13px}
.react-flow__attribution{display:none}
@media (prefers-reduced-motion: reduce){ .row.fresh,.row.fresh .stamp{animation:none} }
@media (max-width: 900px){ .app{grid-template-columns:1fr; grid-template-rows:52px 320px 1fr 150px}
  .bar{grid-column:1} .jobs{grid-column:1} }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React,{useEffect,useMemo,useRef,useState} from "https://esm.sh/react@18";
import {createRoot} from "https://esm.sh/react-dom@18/client";
import ReactFlow,{Background,Handle,Position} from "https://esm.sh/reactflow@11?deps=react@18,react-dom@18";
const h=React.createElement;

const nodeBox=(extra={})=>({background:"var(--steel-900)",color:"var(--paper)",
  border:"1px solid var(--steel-700)",borderRadius:4,padding:"8px 14px",
  font:"600 13px 'Big Shoulders'",letterSpacing:".1em",textTransform:"uppercase",...extra});

function AgentNode({data}){
  return h("div",{style:nodeBox(data.style)},
    h(Handle,{type:"target",position:Position.Left,style:{opacity:0}}),
    h("div",null,data.label),
    data.sub?h("div",{style:{font:"11px 'IBM Plex Mono'",color:"var(--paper-dim)",
      textTransform:"none",letterSpacing:0}},data.sub):null,
    h(Handle,{type:"source",position:Position.Right,style:{opacity:0}}));
}
const nodeTypes={agent:AgentNode};

function Flow({active}){
  const nodes=useMemo(()=>[
    {id:"device",type:"agent",position:{x:0,y:80},data:{label:"Intake",sub:"photo · voice · text"}},
    {id:"foreman",type:"agent",position:{x:220,y:80},data:{label:"Foreman",sub:"routes + records"}},
    {id:"estimator",type:"agent",position:{x:220,y:220},data:{label:"Estimator",sub:"scope + parts"}},
    {id:"gate",type:"agent",position:{x:470,y:80},data:{label:"Write gate",sub:"verifier · journal",
      style:{border:"2px solid var(--safety)"}}},
    {id:"memory",type:"agent",position:{x:730,y:80},data:{label:"Fleet memory",sub:"bi-temporal · pgvector"}},
    {id:"feed",type:"agent",position:{x:470,y:220},data:{label:"Live feed",sub:"firestore"}},
  ],[]);
  const edges=useMemo(()=>[
    {id:"d-f",source:"device",target:"foreman"},
    {id:"f-e",source:"foreman",target:"estimator"},
    {id:"f-g",source:"foreman",target:"gate"},
    {id:"e-g",source:"estimator",target:"gate"},
    {id:"g-m",source:"gate",target:"memory"},
    {id:"g-fd",source:"gate",target:"feed"},
  ].map(e=>({...e,animated:active,style:{stroke:active?"var(--safety)":"var(--steel-700)",strokeWidth:active?2:1.5}})),[active]);
  return h(ReactFlow,{nodes,edges,nodeTypes,fitView:true,proOptions:{hideAttribution:true},
    nodesDraggable:true,zoomOnScroll:false,panOnDrag:true},
    h(Background,{color:"#2A323C",gap:22,size:1}));
}

function App(){
  const [st,setSt]=useState(null);
  const [active,setActive]=useState(false);
  const lastTop=useRef(null);
  useEffect(()=>{
    let stop=false;
    const tick=async()=>{
      try{
        const r=await fetch("/api/state"); const s=await r.json();
        if(stop) return;
        const top=s.journal[0]&&s.journal[0].id;
        if(lastTop.current!==null&&top!==lastTop.current){
          setActive(true); setTimeout(()=>setActive(false),4000);
        }
        lastTop.current=top; setSt(s);
      }catch(e){}
    };
    tick(); const iv=setInterval(tick,2500);
    return ()=>{stop=true; clearInterval(iv)};
  },[]);
  if(!st) return h("div",{className:"empty"},"Connecting to the fleet…");
  const c=st.counters||{};
  return h("div",{className:"app"},
    h("div",{className:"bar"},
      h("div",{className:"wordmark"},"Foreman",h("b",null,"+")),
      h("div",{className:"sub"},"fleet operations · every write through the gate"),
      h("div",{className:"spacer"}),
      h("div",{className:"counter"},
        h("span",{className:"ok"},"■")," approved ",h("b",null,c.approved??0),
        "   ",h("span",{className:"no"},"■")," rejected ",h("b",null,c.rejected??0))),
    h("div",{className:"panel"},h("h2",null,"Fleet topology"),
      h("div",{className:"flow"},h(Flow,{active}))),
    h("div",{className:"panel"},h("h2",null,"Write gate — ledger"),
      h("div",{className:"ledger"},
        st.journal.length===0?h("div",{className:"empty"},"No decisions yet — send the fleet a job."):
        st.journal.map((j,i)=>h("div",{key:j.id,className:"row"+(i===0&&active?" fresh":"")},
          h("div",{className:"who"},j.agent),
          h("div",{className:"what"},
            h("div",null,h("span",{className:"subj"},j.subject)," ",
              h("span",{className:"pred"},j.predicate," = "),
              h("span",{className:"val"},String(j.value??"").slice(0,90))),
            j.reason?h("div",{className:"why"},String(j.reason).slice(0,120)):null),
          h("div",{className:"stamp "+j.verdict},j.verdict))))),
    h("div",{className:"jobs"},
      st.jobs.length===0?h("div",{className:"empty"},"Job board is empty."):
      st.jobs.map(job=>h("div",{key:job.subject,className:"job"},
        h("div",{className:"id"},job.subject.replace("job:","")),
        job.facts.filter(f=>f.predicate!=="estimate").slice(0,6).map((f,i)=>
          h("span",{key:i,className:"chip"},f.predicate,": ",h("b",null,String(f.value).slice(0,28))))))));
}
createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
